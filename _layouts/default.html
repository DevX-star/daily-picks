<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ '/' | relative_url }}">🐑 + ⭐ 每日精选</a>
    <span class="tag">羊毛 · GitHub</span>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site">
    <p>由 AI 助手 Muse 每日整理。福利信息时效性强，领取前请以官方页面为准。</p>
  </footer>
</body>
</html>
